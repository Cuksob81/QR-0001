<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111315">
    <meta name="description" content="A little page about love.">
    <title>关于爱 · On Love</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 22px;
            background: #111315;
            color: #f1f1ed;
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: 100%;
            max-width: 650px;
            text-align: center;
            animation: appear 1.6s ease both;
        }

        .label {
            color: #b8d9c0;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 46px;
        }

        .quote {
            font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 400;
            line-height: 2;
            letter-spacing: 1px;
            overflow-wrap: anywhere;
        }

        .quote p { margin: 0 0 14px; }

        .line {
            width: 55px;
            height: 1px;
            background: #657c69;
            margin: 36px auto;
        }

        .translation {
            color: #c6c8c3;
            font-size: 16px;
            line-height: 2;
            font-style: italic;
        }

        footer {
            margin-top: 52px;
            color: #819584;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            main { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <div class="label">关于爱 · ON LOVE</div>

        <section class="quote">
            <p>去爱别人没什么。</p>
            <p>被别人爱，意味着一些东西。</p>
            <p>但爱别人，同时也被别人爱，才是一切。</p>
        </section>

        <div class="line"></div>

        <section class="translation">
            To love someone is nothing extraordinary.
            To be loved means something.
            But to love someone and be loved in return —
            that is everything.
        </section>

        <footer>A LITTLE PAGE ABOUT LOVE</footer>
    </main>
</body>
</html>
